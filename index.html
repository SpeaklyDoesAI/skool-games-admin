<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Skool Games Applications | Admin</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1c1f24; --muted: #5f6672; --border: #dde1e6;
      --accent: #ff8a0d; --accent-dark: #e67600; --bad: #c5221f; --bad-bg: #fce8e6;
      --good: #188038; --good-dark: #137333; --good-bg: #e6f4ea;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px 48px; }
    header.brand { text-align: center; margin-bottom: 20px; }
    header.brand h1 { margin: 0; font-size: 1.6rem; }
    header.brand p { margin: 4px 0 0; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 14px; font-size: 1.15rem; }
    label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
    button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: #fff; padding: 8px 14px; color: var(--text); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; padding: 14px 20px; width: 100%; font-size: 1.05rem; }
    button.primary:hover { background: var(--accent-dark); }
    button:disabled { opacity: .6; cursor: wait; }
    .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
    [hidden] { display: none !important; }
    a { color: var(--accent-dark); font-weight: 600; }

    .login { max-width: 400px; margin: 40px auto; }
    .login .field { margin-bottom: 14px; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .count { font-weight: 700; font-size: 1.1rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .filters input { flex: 2 1 240px; width: auto; }
    .filters select { flex: 1 1 160px; width: auto; }
    .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #fafbfc; font-weight: 600; }
    tbody tr[data-id] { cursor: pointer; }
    tbody tr[data-id]:hover { background: #fff7ee; }
    td.num { text-align: right; }
    .sub { color: var(--muted); font-size: .82rem; }

    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tabs button { font-weight: 600; }
    .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tabs .n { display: inline-block; min-width: 1.6em; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: rgba(0,0,0,.08); font-size: .82rem; text-align: center; }
    button.approve { background: var(--good); border-color: var(--good); color: #fff; font-weight: 600; }
    button.approve:hover { background: var(--good-dark); }
    button.deny { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
    button.deny:hover { background: #a50e0e; }
    td .actions { display: flex; gap: 6px; }
    td .actions button { padding: 4px 10px; font-size: .85rem; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: .82rem; }
    .badge.approved { background: var(--good-bg); color: var(--good-dark); }
    .badge.denied { background: var(--bad-bg); color: var(--bad); }
    .badge.pending { background: #fff3e0; color: var(--accent-dark); }
    .status-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .status-bar .grow { flex: 1 1 auto; }
    dialog .error { margin: 12px 20px 0; }

    dialog { border: none; border-radius: 12px; padding: 0; width: min(720px, calc(100% - 32px)); max-height: calc(100% - 32px); }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    dialog .head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: #fff; }
    dialog .head h3 { margin: 0; }
    dialog dl { margin: 0; padding: 16px 20px; display: grid; grid-template-columns: 180px 1fr; gap: 8px 12px; }
    dialog dt { font-weight: 600; color: var(--muted); }
    dialog dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

    .cards, .back-label { display: none; }

    /* Phones */
    @media (max-width: 699.98px) {
      .wrap { padding: 16px max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      header.brand { margin-bottom: 14px; }
      header.brand h1 { font-size: 1.35rem; }
      button, input, select { min-height: 44px; font-size: 16px; }

      .login { margin: 8vh auto 24px; width: 100%; }

      .toolbar { gap: 4px 8px; }
      #who { overflow-wrap: anywhere; }

      .tabs { position: sticky; top: 0; z-index: 5; flex-wrap: nowrap; gap: 6px; margin: 0 -16px 12px; padding: 8px 16px; background: var(--bg); }
      .tabs button { flex: 1 1 0; min-width: 0; padding: 6px 4px; font-size: 15px; white-space: nowrap; }
      .tabs .n { margin-left: 2px; padding: 0 5px; min-width: 1.4em; }

      .filters { flex-direction: column; }
      .filters input, .filters select { flex: none; width: 100%; }

      .table-wrap { display: none; }
      .cards { display: block; }
      .app-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
      .app-card:active { background: #fff7ee; }
      .app-card .name { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
      .app-card .meta { color: var(--text); overflow-wrap: anywhere; }
      .app-card .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
      .app-card .row a { display: inline-flex; align-items: center; min-height: 44px; }
      .app-card .row .sub.none { display: inline-flex; align-items: center; min-height: 44px; }
      .card-actions { display: flex; gap: 10px; margin-top: 6px; }
      .card-actions button { flex: 1 1 0; min-height: 48px; }
      .cards .empty { padding: 16px; }

      dialog[open] { display: flex; flex-direction: column; }
      dialog { width: 100%; max-width: none; height: 100vh; height: 100dvh; max-height: none; margin: 0; inset: 0; border-radius: 0; overflow: hidden; }
      dialog .head { flex: none; justify-content: flex-start; gap: 12px; padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
      dialog .head h3 { font-size: 1.1rem; min-width: 0; overflow-wrap: anywhere; }
      #closeDetail { order: -1; flex: none; font-weight: 600; }
      .back-label { display: inline; }
      .x-label { display: none; }
      dialog .error { flex: none; margin: 12px 16px 0; }
      dialog dl { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: block; padding: 16px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
      dialog dt { font-size: .85rem; margin-bottom: 2px; }
      dialog dd { margin: 0 0 16px; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
      .status-bar { order: 10; flex: none; border-bottom: none; border-top: 1px solid var(--border); background: #fff; padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); box-shadow: 0 -2px 8px rgba(0,0,0,.06); }
      .status-bar .grow { flex-basis: 100%; height: 0; }
      .status-bar button { flex: 1 1 0; min-height: 48px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <h1>TikTok Live Skool Games</h1>
      <p>Applications Admin</p>
    </header>

    <section id="loginView" class="card login" hidden>
      <h2>Admin Login</h2>
      <form id="loginForm">
        <div id="loginError" class="error" role="alert" hidden></div>
        <div class="field"><label for="username">Username</label><input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button type="submit" class="primary" id="loginBtn">Sign In</button>
      </form>
    </section>

    <section id="appView" hidden>
      <div class="toolbar">
        <div class="count" id="count"></div>
        <div><span class="sub" id="who"></span> <button id="signOut">Sign out</button></div>
      </div>
      <div id="listError" class="error" role="alert" hidden></div>
      <div id="listBody" hidden>
        <div class="tabs" role="tablist" id="tabs">
          <button role="tab" data-status="pending" aria-selected="true">Pending <span class="n" id="n-pending">0</span></button>
          <button role="tab" data-status="approved" aria-selected="false">Approved <span class="n" id="n-approved">0</span></button>
          <button role="tab" data-status="denied" aria-selected="false">Denied <span class="n" id="n-denied">0</span></button>
        </div>
        <div id="actionError" class="error" role="alert" hidden></div>
        <div class="filters">
          <input id="search" type="search" placeholder="Search name, email, TikTok or niche" aria-label="Search">
          <select id="nicheFilter" aria-label="Niche"><option value="">All niches</option></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Submitted</th><th>Name</th><th>Email</th><th>Phone</th><th>TikTok</th>
                <th class="num">Followers</th><th>Niche</th><th>MRR</th><th>Video</th><th id="extraCol">Review</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="cards" id="cards"></div>
      </div>
    </section>
  </main>

  <dialog id="detail">
    <div class="head"><h3 id="detailTitle">Application</h3><button id="closeDetail" aria-label="Close"><span class="back-label">← Back</span><span class="x-label">✕</span></button></div>
    <div id="detailError" class="error" role="alert" hidden></div>
    <div class="status-bar" id="detailStatus"></div>
    <dl id="detailList"></dl>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
    const $ = id => document.getElementById(id);
    let all = [];
    let tab = 'pending';
    let detailId = null;
    const STATUSES = ['pending', 'approved', 'denied'];
    const LABEL = { pending: 'Pending', approved: 'Approved', denied: 'Denied' };
    const statusOf = r => STATUSES.includes(r.status) ? r.status : 'pending';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const date = d => d ? new Date(d).toLocaleString('en-US', { timeZone: 'America/New_York', dateStyle: 'medium', timeStyle: 'short' }) + ' ET' : '';
    const num = n => n == null || n === '' ? '' : Number(n).toLocaleString('en-US');
    const safeUrl = u => { try { const x = new URL(String(u).trim()); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
    const link = (u, text) => { const h = safeUrl(u); return h ? `<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(text ?? u)}</a>` : null; };
    const toEmail = u => u.includes('@') ? u : u + '@goliveacademy.com';

    function showLogin() { $('loginView').hidden = false; $('appView').hidden = true; }

    async function showApp(session) {
      $('loginView').hidden = true;
      $('appView').hidden = false;
      $('who').textContent = session.user.email;
      $('listError').hidden = true;
      $('listBody').hidden = true;
      $('count').textContent = 'Loading…';
      const { data, error } = await sb.from('skool_games_applications').select('*').order('created_at', { ascending: false });
      if (error) {
        $('count').textContent = '';
        $('listError').textContent = "This account doesn't have access.";
        $('listError').hidden = false;
        return;
      }
      all = data || [];
      const niches = [...new Set(all.map(r => (r.niche || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      $('nicheFilter').innerHTML = '<option value="">All niches</option>' + niches.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
      $('listBody').hidden = false;
      render();
    }

    function filtered() {
      const q = $('search').value.trim().toLowerCase();
      const niche = $('nicheFilter').value;
      return all.filter(r => statusOf(r) === tab &&
        (!niche || (r.niche || '').trim() === niche) &&
        (!q || [r.full_name, r.email, r.tiktok, r.niche].some(v => String(v ?? '').toLowerCase().includes(q))));
    }

    function render() {
      const rows = filtered();
      const counts = { pending: 0, approved: 0, denied: 0 };
      all.forEach(r => counts[statusOf(r)]++);
      STATUSES.forEach(s => $('n-' + s).textContent = counts[s]);
      document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.status === tab)));
      $('extraCol').textContent = tab === 'pending' ? 'Review' : 'Status';
      const total = counts[tab];
      const word = LABEL[tab].toLowerCase();
      $('count').textContent = rows.length === total
        ? `${total} ${word} application${total === 1 ? '' : 's'}`
        : `${rows.length} of ${total} ${word} applications`;
      const emptyMsg = total ? 'No applications match.' : `No ${word} applications.`;
      $('rows').innerHTML = rows.map(r => `
        <tr data-id="${esc(r.id)}">
          <td>${esc(date(r.created_at))}</td>
          <td>${esc(r.full_name)}</td>
          <td>${esc(r.email)}</td>
          <td>${esc(r.phone)}</td>
          <td>${esc(r.tiktok)}</td>
          <td class="num">${esc(num(r.tiktok_followers))}</td>
          <td>${esc(r.niche)}</td>
          <td>${esc(r.mrr)}</td>
          <td>${link(r.video_url, 'Watch') || '<span class="sub">None</span>'}</td>
          <td>${tab === 'pending'
            ? '<div class="actions"><button class="approve" data-act="approved">Approve</button><button class="deny" data-act="denied">Deny</button></div>'
            : `<span class="badge ${tab}">${LABEL[tab]}</span> <span class="sub">${esc(date(r.decided_at))}</span>`}</td>
        </tr>`).join('') || `<tr><td colspan="10" class="sub">${emptyMsg}</td></tr>`;
      $('cards').innerHTML = rows.map(r => `
        <div class="app-card" data-id="${esc(r.id)}" role="button" tabindex="0">
          <div class="name">${esc(r.full_name) || '<span class="sub">No name</span>'}</div>
          <div class="meta">${[r.niche, r.mrr ? 'MRR: ' + r.mrr : ''].filter(Boolean).map(esc).join(' · ') || '<span class="sub">No niche / MRR</span>'}</div>
          <div class="row">
            <span class="sub">${esc(date(r.created_at))}</span>
            ${link(r.video_url, 'Watch video') || '<span class="sub none">No video</span>'}
          </div>
          ${tab === 'pending'
            ? '<div class="card-actions"><button class="approve" data-act="approved">Approve</button><button class="deny" data-act="denied">Deny</button></div>'
            : `<div><span class="badge ${tab}">${LABEL[tab]}</span> <span class="sub">${esc(date(r.decided_at))}</span></div>`}
        </div>`).join('') || `<div class="card empty sub">${emptyMsg}</div>`;
    }

    async function setStatus(id, status, btns, errEl) {
      if (status === 'denied' && !confirm('Deny this application?')) return;
      errEl.hidden = true;
      btns.forEach(b => b.disabled = true);
      const { data, error } = await sb.rpc('set_skool_games_status', { p_id: id, p_status: status });
      btns.forEach(b => b.disabled = false);
      const res = Array.isArray(data) ? data[0] : data;
      if (error || !res) {
        errEl.textContent = "Couldn't update the status. Please try again.";
        errEl.hidden = false;
        return;
      }
      const r = all.find(x => String(x.id) === String(id));
      if (r) { r.status = res.status; r.decided_at = res.decided_at; }
      render();
      if (r && detailId != null && String(detailId) === String(id)) renderStatus(r);
    }

    function renderStatus(r) {
      const s = statusOf(r);
      $('detailStatus').innerHTML = s === 'pending'
        ? '<span class="badge pending">Pending</span><span class="grow"></span><button class="approve" data-act="approved">Approve</button><button class="deny" data-act="denied">Deny</button>'
        : `<span class="badge ${s}">${LABEL[s]}</span><span class="sub">${esc(date(r.decided_at))}</span><span class="grow"></span><button data-act="pending">Move back to Pending</button>`;
    }

    function openDetail(r) {
      const items = [
        ['Submitted', esc(date(r.created_at))],
        ['Full Name', esc(r.full_name)],
        ['Email', esc(r.email)],
        ['Phone', esc(r.phone)],
        ['TikTok', esc(r.tiktok)],
        ['TikTok Followers', esc(num(r.tiktok_followers))],
        ['Niche', esc(r.niche)],
        ['Community', esc(r.community)],
        ['MRR', esc(r.mrr)],
        ['Why Choose You', esc(r.why_choose_you)],
        ['Live Experience', esc(r.live_experience)],
        ['7-Day Commit', esc(r.seven_day_commit)],
        ['Note to Sam', esc(r.note_to_sam)],
        ['Video', link(r.video_url) || esc(r.video_url)],
      ];
      detailId = r.id;
      $('detailError').hidden = true;
      renderStatus(r);
      $('detailTitle').textContent = r.full_name || 'Application';
      $('detailList').innerHTML = items.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v || '<span class="sub">—</span>'}</dd>`).join('');
      $('detail').showModal();
    }

    function onListClick(e) {
      if (e.target.closest('a')) return;
      const item = e.target.closest('[data-id]');
      if (!item) return;
      const act = e.target.closest('button[data-act]');
      if (act) { setStatus(item.dataset.id, act.dataset.act, [...item.querySelectorAll('button')], $('actionError')); return; }
      const r = all.find(x => String(x.id) === item.dataset.id);
      if (r) openDetail(r);
    }
    $('rows').addEventListener('click', onListClick);
    $('cards').addEventListener('click', onListClick);
    $('cards').addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.app-card')) { e.preventDefault(); e.target.click(); }
    });
    $('detailStatus').addEventListener('click', e => {
      const act = e.target.closest('button[data-act]');
      if (act && detailId != null) setStatus(detailId, act.dataset.act, [...$('detailStatus').querySelectorAll('button')], $('detailError'));
    });
    $('tabs').addEventListener('click', e => {
      const b = e.target.closest('button[data-status]');
      if (!b) return;
      tab = b.dataset.status;
      $('actionError').hidden = true;
      render();
    });
    $('detail').addEventListener('close', () => { detailId = null; });
    $('closeDetail').addEventListener('click', () => $('detail').close());
    $('detail').addEventListener('click', e => { if (e.target === $('detail')) $('detail').close(); });
    $('search').addEventListener('input', render);
    $('nicheFilter').addEventListener('change', render);

    $('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      $('loginError').hidden = true;
      $('loginBtn').disabled = true;
      const { data, error } = await sb.auth.signInWithPassword({ email: toEmail($('username').value.trim()), password: $('password').value });
      $('loginBtn').disabled = false;
      if (error) { $('loginError').textContent = 'Incorrect username or password.'; $('loginError').hidden = false; return; }
      $('password').value = '';
      showApp(data.session);
    });

    $('signOut').addEventListener('click', async () => {
      await sb.auth.signOut();
      all = [];
      $('rows').innerHTML = '';
      $('search').value = '';
      showLogin();
    });

    sb.auth.getSession().then(({ data }) => data.session ? showApp(data.session) : showLogin());
  </script>
</body>
</html>
